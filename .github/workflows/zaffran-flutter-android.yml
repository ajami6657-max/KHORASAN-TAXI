name: Zaffran Taxi Flutter Android

on:
  push:
    branches: [ "zaffran-taxi-foundation" ]
    paths:
      - "mobile_src/**"
      - ".github/workflows/zaffran-flutter-android.yml"
      - "app/src/main/res/mipmap-nodpi/ic_launcher.jpg"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android and iOS platform folders
        run: flutter create --platforms=android,ios --org ir.zaffran.taxi --project-name zaffran_taxi build/zaffran_mobile
      - name: Install Zaffran app source and launcher icon
        run: |
          cp mobile_src/pubspec.yaml build/zaffran_mobile/pubspec.yaml
          cp mobile_src/lib/main.dart build/zaffran_mobile/lib/main.dart
          mkdir -p build/zaffran_mobile/assets
          cp app/src/main/res/mipmap-nodpi/ic_launcher.jpg build/zaffran_mobile/assets/zaffran_icon.jpg
      - name: Resolve dependencies and generate launcher icons
        working-directory: build/zaffran_mobile
        run: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Remove generated template test
        working-directory: build/zaffran_mobile
        run: rm -rf test
      - name: Analyze Flutter app
        working-directory: build/zaffran_mobile
        run: flutter analyze
      - name: Build debug APK
        working-directory: build/zaffran_mobile
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaffran-taxi-android-debug
          path: build/zaffran_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
